name: E2E

# Сквозные тесты по критериям готовности (раздел 16 ТЗ) против полного стека в docker compose.
# Запуск вручную (Actions → E2E → Run workflow) и после слияния в main.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Стек (docker compose)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - run: pnpm install --frozen-lockfile
      - name: Браузер Playwright
        run: pnpm --filter @gunraid/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
      - name: Нагрузочный и конкурентный прогон
        run: pnpm load -- --users 30 --duration 20
      - name: Логи стека
        if: failure()
        run: docker compose logs --no-color --tail 300 api worker web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
